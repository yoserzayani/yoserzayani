<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Yosr Zayani — Software Engineer</title>
  <desc id="desc">Professional GitHub profile banner for Yosr Zayani, a full-stack and mobile software engineer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B1A"/>
      <stop offset="0.55" stop-color="#17163C"/>
      <stop offset="1" stop-color="#3B1F70"/>
    </linearGradient>
    <linearGradient id="monogram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6558F5"/>
      <stop offset="1" stop-color="#B68CFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="30" fill="url(#background)"/>
  <rect width="1600" height="420" rx="30" fill="url(#grid)"/>

  <circle cx="1490" cy="-10" r="260" fill="#7B61FF" opacity="0.17"/>
  <circle cx="1450" cy="390" r="170" fill="#45C7F5" opacity="0.10"/>
  <circle cx="100" cy="450" r="260" fill="#7667F7" opacity="0.13"/>

  <g filter="url(#shadow)">
    <circle cx="230" cy="210" r="112" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="230" cy="210" r="88" fill="url(#monogram)"/>
    <text x="230" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">YZ</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="410" y="158" font-size="70" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Yosr Zayani</text>
    <text x="414" y="211" font-size="29" font-weight="600" fill="#CBC8FF">Software Engineer · Full-Stack &amp; Mobile Developer</text>
    <text x="414" y="257" font-size="21" font-weight="400" fill="#E3E5F4" opacity="0.88">Building reliable web, mobile and backend applications</text>

    <g transform="translate(414 300)" font-size="17" font-weight="700">
      <g>
        <rect width="92" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="46" y="25" text-anchor="middle" fill="#FFFFFF">Java</text>
      </g>
      <g transform="translate(105)">
        <rect width="132" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="66" y="25" text-anchor="middle" fill="#FFFFFF">Spring Boot</text>
      </g>
      <g transform="translate(250)">
        <rect width="108" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="54" y="25" text-anchor="middle" fill="#FFFFFF">Angular</text>
      </g>
      <g transform="translate(371)">
        <rect width="140" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="70" y="25" text-anchor="middle" fill="#FFFFFF">React Native</text>
      </g>
      <g transform="translate(524)">
        <rect width="108" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="54" y="25" text-anchor="middle" fill="#FFFFFF">Node.js</text>
      </g>
    </g>
  </g>

  <g transform="translate(1360 150)" opacity="0.9">
    <rect width="150" height="120" rx="28" fill="#FFFFFF" fill-opacity="0.06" stroke="#A99DFF" stroke-opacity="0.45" stroke-width="2"/>
    <text x="75" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#BDB5FF">&lt;/&gt;</text>
  </g>
</svg>
