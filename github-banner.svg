    <circle cx="230" cy="210" r="88" fill="url(#monogram)"/>
    <text x="230" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#102919">YZ</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="410" y="158" font-size="70" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Yosr Zayani</text>
