      <g>
        <rect width="92" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="46" y="25" text-anchor="middle" fill="#FFFFFF">Java</text>
      </g>
      <g transform="translate(105)">
        <rect width="132" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="66" y="25" text-anchor="middle" fill="#FFFFFF">Spring Boot</text>
      </g>
      <g transform="translate(250)">
        <rect width="108" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="54" y="25" text-anchor="middle" fill="#FFFFFF">Angular</text>
      </g>
      <g transform="translate(371)">
