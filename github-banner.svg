        <text x="70" y="25" text-anchor="middle" fill="#FFFFFF">React Native</text>
      </g>
      <g transform="translate(524)">
        <rect width="108" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="54" y="25" text-anchor="middle" fill="#FFFFFF">Node.js</text>
      </g>
