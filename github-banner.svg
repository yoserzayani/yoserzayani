<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Yosr Zayani — Software Engineer</title>
  <desc id="desc">Professional GitHub profile banner for Yosr Zayani, a full-stack and mobile software engineer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07140D"/>
      <stop offset="0.55" stop-color="#0D2A19"/>
      <stop offset="1" stop-color="#164D2B"/>
    </linearGradient>
    <linearGradient id="monogram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9B949"/>
      <stop offset="1" stop-color="#F6D782"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="30" fill="url(#background)"/>
  <rect width="1600" height="420" rx="30" fill="url(#grid)"/>

  <circle cx="1490" cy="-10" r="260" fill="#36A763" opacity="0.13"/>
  <circle cx="1450" cy="390" r="170" fill="#E9B949" opacity="0.08"/>
  <circle cx="100" cy="450" r="260" fill="#36A763" opacity="0.09"/>

  <g filter="url(#shadow)">
